<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyHub</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header>
            <h1>MyHub</h1>
            <p>Tempat kecil buat keseharian lo.</p>
        </header>

        <main>

            <!-- WELCOME -->
            <section class="welcome">
                <h2>Halo 👋</h2>
                <p>Selamat datang di MyHub.</p>
            </section>

            <!-- MENU -->
            <section class="menu">

                <!-- MUSIC -->
                <a href="music.html" class="menu-card">
                   <i class="fa-solid fa-music menu-icon"></i>
                   <h3>Music</h3>
                   <p>Playlist favorit</p>
                </a>
                <!-- GALLERY -->
               <a href="gallery.html" class="menu-card">
                   <i class="fa-solid fa-images menu-icon"></i>
                   <h3>Gallery</h3>
                   <p>Foto-foto lo</p>
                </a>

                <!-- NOTES -->
                <a href="notes.html" class="menu-card">
                    <i class="fa-solid fa-note-sticky menu-icon"></i>
                    <h3>Notes</h3>
                    <p>Catatan pribadi</p>
                </a>

                <a href="todo.html" class="menu-card">
                    <i class="fa-solid fa-list-check menu-icon"></i>
                    <h3>To-Do</h3>
                    <p>Daftar kegiatan</p>
                </a>
            </section>


<!-- SETTINGS -->
<section class="settings-section">

    <h2>⚙️ Settings</h2>

    <div class="settings-box">

        <div class="setting-item">
            <div>
                <h3>Tampilan</h3>
                <p>Ubah tema MyHub</p>
            </div>

            <button id="themeToggle">
                ☀️
            </button>
        </div>

    </div>

</section>

            
        <!-- BOTTOM NAVIGATION -->
        <nav class="bottom-nav">

            <button>
                <i class="fa-solid fa-house"></i>
                <small>Home</small>
            </button>

            <button>
                <i class="fa-solid fa-music"></i>
                <small>Music</small>
            </button>

            <button>
                <i class="fa-solid fa-images"></i>
                <small>Gallery</small>
            </button>

            <button>
                <i class="fa-solid fa-gear"></i>
                <small>Settings</small>
            </button>

        </nav>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
