<script>
(function(){const p=location.pathname.split("/").pop()||"index.html";const map={"index.html":"home","quick-access.html":"quick","finance.html":"finance","settings.html":"settings"};const k=map[p]||"";document.querySelectorAll(".bottom-nav a").forEach(a=>{if(a.dataset.nav===k)a.classList.add("active");});})();
</script>
<script>
(function(){
  function launchGame(card){
    var fallback=card.getAttribute('href');
    var scheme=card.dataset.gameScheme;
    var pkg=card.dataset.gamePackage;
    var left=true;
    var done=false;
    function fallbackOpen(){ if(done)return; done=true; window.location.href=fallback; }
    document.addEventListener('visibilitychange',function(){ if(document.hidden){left=false; done=true;} },{once:true});
    window.addEventListener('pagehide',function(){done=true;},{once:true});
    if(/Android/i.test(navigator.userAgent) && pkg){
      var intent='intent://launch#Intent;scheme='+scheme.replace('://','')+';package='+pkg+';end';
      window.location.href=intent;
    }else if(scheme){
      window.location.href=scheme;
    }else{ fallbackOpen(); return; }
    setTimeout(function(){ if(!document.hidden && !done) fallbackOpen(); },1200);
  }
  document.querySelectorAll('.game-app[data-game-package]').forEach(function(card){
    card.addEventListener('click',function(e){ e.preventDefault(); launchGame(card); });
  });
})();
</script>
