<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notes — MyHub</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header>
            <h1>MyHub Notes</h1>
            <p>Catatan pribadi lo 📝</p>
        </header>

        <main>

            <section class="notes-section">

                <h2>📝 Catatan</h2>

                <div class="notes-box">

                    <input
                        type="text"
                        id="noteTitle"
                        placeholder="Judul catatan..."
                    >

                    <textarea
                        id="noteText"
                        placeholder="Tulis catatan lo di sini..."
                    ></textarea>

                    <button id="saveNote">
                        💾 Simpan Catatan
                    </button>

                    <div id="savedNotes"></div>

                </div>

            </section>

            <br>

            <a href="index.html" style="color: white;">
                ← Kembali ke Home
            </a>

        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
