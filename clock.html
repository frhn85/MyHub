<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clock — MyHub</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="aero-shards.css">
</head>

<body>

    <div class="aero-shards" aria-hidden="true"><canvas id="aeroShardsCanvas"></canvas></div>

<div class="app">

    <a class="back-home" href="index.html"><i class="fa-solid fa-arrow-left"></i><span>Kembali ke Home</span></a>

    <header class="header">
        <div>
            <p class="small-title">MYHUB</p>
            <h1>Clock</h1>
            <p class="subtitle">Jam & alarm ⏰</p>
        </div>

        <div class="profile-icon">
            <i class="fa-solid fa-clock"></i>
        </div>
    </header>

    <main>

        <section class="hero">
            <div class="hero-text">
                <p>CURRENT TIME</p>

                <h2 id="digitalClock">00:00:00</h2>

                <span id="currentDate">
                    Memuat tanggal...
                </span>
            </div>
        </section>

        <section class="alarm-box">

            <div class="section-title">
                <p>ALARM</p>
                <h2>Set Alarm</h2>
            </div>

            <div class="alarm-form">

                <input type="time" id="alarmTime">

                <button id="setAlarm">
                    <i class="fa-solid fa-bell"></i>
                    Pasang Alarm
                </button>

            </div>

            <div id="alarmStatus" class="alarm-status">
                Belum ada alarm.
            </div>

        </section>

        <br>


    </main>

</div>

<script src="script.js"></script>

    <script src="aero-shards.js"></script>

    <nav class="bottom-nav">
        <a href="index.html" data-nav="home">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="game.html" data-nav="game">
            <i class="fa-solid fa-gamepad"></i>
            <span>Game</span>
        </a>
        <a href="finance.html" data-nav="finance">
            <i class="fa-solid fa-wallet"></i>
            <span>Finance</span>
        </a>
        <a href="settings.html" data-nav="settings">
            <i class="fa-solid fa-gear"></i>
            <span>Pengaturan</span>
        </a>
    </nav>

<script>
(function(){const p=location.pathname.split("/").pop()||"index.html";const map={"index.html":"home","game.html":"game","finance.html":"finance","settings.html":"settings"};const k=map[p]||"";document.querySelectorAll(".bottom-nav a").forEach(a=>{if(a.dataset.nav===k)a.classList.add("active");});})();
</script>
</body>
</html>
