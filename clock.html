<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clock — MyHub</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="header">
        <div>
            <p class="small-title">MYHUB</p>
            <h1>Clock</h1>
            <p class="subtitle">Jam & alarm ⏰</p>
        </div>

        <div class="profile-icon">
            <i class="fa-solid fa-clock"></i>
        </div>
    </header>

    <main>

        <section class="hero">
            <div class="hero-text">
                <p>CURRENT TIME</p>

                <h2 id="digitalClock">00:00:00</h2>

                <span id="currentDate">
                    Memuat tanggal...
                </span>
            </div>
        </section>

        <section class="alarm-box">

            <div class="section-title">
                <p>ALARM</p>
                <h2>Set Alarm</h2>
            </div>

            <div class="alarm-form">

                <input type="time" id="alarmTime">

                <button id="setAlarm">
                    <i class="fa-solid fa-bell"></i>
                    Pasang Alarm
                </button>

            </div>

            <div id="alarmStatus" class="alarm-status">
                Belum ada alarm.
            </div>

        </section>

        <br>

        <a href="index.html">← Kembali ke Home</a>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
