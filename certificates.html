<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificates — MyHub</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="aero-shards.css">
</head>

<body>

    <div class="aero-shards" aria-hidden="true"><canvas id="aeroShardsCanvas"></canvas></div>

<div class="app">

    <header class="header">
        <a class="back-home" href="index.html" aria-label="Kembali ke Home" title="Kembali ke Home"><i class="fa-solid fa-house"></i></a>
        <div>
            <p class="small-title">MYHUB</p>
            <h1>Certificates</h1>
            <p class="subtitle">Sertifikat & pencapaian </p>
        </div>
    </header>

    <main>

        <section class="hero">
            <div class="hero-text">
                <p>MY ACHIEVEMENTS</p>

                <h2>Pencapaian gw.</h2>

                <span>
                    Kumpulan sertifikat dan prestasi.
                </span>
            </div>
        </section>

        <section class="certificate-box">

            <div class="section-title">
                <p>ADD CERTIFICATE</p>
                <h2>Tambah Sertifikat</h2>
            </div>

            <div class="certificate-form">

                <input
                type="text"
                id="certificateName"
                placeholder="Nama sertifikat"
    >

                <input
                type="text"
                id="certificateInfo"
                placeholder="Keterangan / penyelenggara"
    >    

             <label class="upload-certificate">
                <i class="fa-solid fa-image"></i>
                Pilih Foto Sertifikat
                <input
                type="file"
                id="certificateImage"
                accept="image/*"
        >
            </label>

                <button id="addCertificate">
                <i class="fa-solid fa-plus"></i>
                Tambah Sertifikat
                </button>

         </div>

        </section>

        <section class="certificate-box">

            <div class="section-title">
                <p>MY CERTIFICATES</p>
                <h2>Sertifikat gw</h2>
            </div>

            <div id="certificateList"></div>

        </section>

        <br>


    </main>

</div>

<script src="script.js"></script>

    <script src="aero-shards.js"></script>

    <nav class="bottom-nav" aria-label="Navigasi utama">
  <a href="index.html" data-nav="home" aria-label="Home"><i class="fa-solid fa-house"></i><span>Home</span></a>
  <a href="quick-access.html" data-nav="quick" aria-label="Quick Access"><i class="fa-solid fa-grip"></i><span>Quick Access</span></a>
  <a href="finance.html" data-nav="finance" aria-label="Finance"><i class="fa-solid fa-wallet"></i><span>Finance</span></a>
  <a href="settings.html" data-nav="settings" aria-label="Pengaturan"><i class="fa-solid fa-gear"></i><span>Pengaturan</span></a>
</nav>
<script src="dock.js"></script>
<script src="myhub-plus.js"></script>
</body>
</html>
