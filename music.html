<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music — MyHub</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="aero-shards.css">
</head>

<body>

    <div class="aero-shards" aria-hidden="true"><canvas id="aeroShardsCanvas"></canvas></div>

<div class="app">

    <header class="header">
        <a class="back-home" href="index.html" aria-label="Kembali ke Home" title="Kembali ke Home"><i class="fa-solid fa-house"></i></a>
        <div>
            <p class="small-title">MYHUB</p>
            <h1>Music</h1>
            <p class="subtitle">Playlist favorit gw </p>
        </div>

        <div class="profile-icon">
            <i class="fa-solid fa-music"></i>
        </div>
    </header>


    <main>

        <section class="music-section">

            <div class="section-title">
                <p>MY PLAYLIST</p>
                <h2>Playlist Favorit</h2>
            </div>


            <!-- SONG 1 -->
            <div class="spotify-box">
                <iframe
                    src="https://open.spotify.com/embed/track/3rPtS4nfpy7PsARctAWpzd"
                    width="100%"
                    height="152"
                    frameborder="0"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy">
                </iframe>
            </div>


            <!-- SONG 2 -->
            <div class="spotify-box">
                <iframe
                    src="https://open.spotify.com/embed/track/48BWWtyjFE2le9sIqJitoL"
                    width="100%"
                    height="152"
                    frameborder="0"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy">
                </iframe>
            </div>


            <!-- SONG 3 -->
            <div class="spotify-box">
                <iframe
                    src="https://open.spotify.com/embed/track/3AAAGS7iM1ekDywqdYMJG2"
                    width="100%"
                    height="152"
                    frameborder="0"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy">
                </iframe>
            </div>


            <!-- SONG 4 -->
            <div class="spotify-box">
                <iframe
                    src="https://open.spotify.com/embed/track/5gkTGkjFB5wAd3mSBEcQPY"
                    width="100%"
                    height="152"
                    frameborder="0"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy">
                </iframe>
            </div>

        </section>

        <br>


    </main>

</div>

    <script src="aero-shards.js"></script>

    <nav class="bottom-nav">
        <a href="index.html" data-nav="home">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="game.html" data-nav="game">
            <i class="fa-solid fa-gamepad"></i>
            <span>Game</span>
        </a>
        <a href="finance.html" data-nav="finance">
            <i class="fa-solid fa-wallet"></i>
            <span>Finance</span>
        </a>
        <a href="settings.html" data-nav="settings">
            <i class="fa-solid fa-gear"></i>
            <span>Pengaturan</span>
        </a>
    </nav>

<script>
(function(){const p=location.pathname.split("/").pop()||"index.html";const map={"index.html":"home","game.html":"game","finance.html":"finance","settings.html":"settings"};const k=map[p]||"";document.querySelectorAll(".bottom-nav a").forEach(a=>{if(a.dataset.nav===k)a.classList.add("active");});})();
</script>
<script src="myhub-plus.js"></script>
</body>
</html>
