<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music — MyHub</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header>
            <h1>MyHub Music</h1>
            <p>Playlist favorit lo 🎵</p>
        </header>

        <main>

            <section class="music-player">

                <h2>🎵 Now Playing</h2>

                <div class="spotify-box">

                    <iframe
                        src="https://open.spotify.com/embed/track/3rPtS4nfpy7PsARctAWpzd?utm_source=generator"
                        width="100%"
                        height="152"
                        frameborder="0"
                        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                        loading="lazy">
                    </iframe>

                </div>

            </section>

            <br>

            <a href="index.html" style="color: white;">
                ← Kembali ke Home
            </a>

        </main>

    </div>

</body>
</html>
