<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do — MyHub</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="aero-shards.css">
</head>

<body>

    <div class="aero-shards" aria-hidden="true"><canvas id="aeroShardsCanvas"></canvas></div>

<div class="app">

    <header class="header">
        <a class="back-home" href="index.html" aria-label="Kembali ke Home" title="Kembali ke Home"><i class="fa-solid fa-house"></i></a>
        <div>
            <p class="small-title">MYHUB</p>
            <h1>To-Do</h1>
            <p class="subtitle">Atur kegiatan gw </p>
        </div>

        <div class="profile-icon">
            <i class="fa-solid fa-list-check"></i>
        </div>
    </header>

    <main>

        <section class="todo-box">

            <div class="section-title">
                <p>MY TASKS</p>
                <h2>Daftar Kegiatan</h2>
            </div>

            <div class="todo-form">

                <input
                    type="text"
                    id="todoInput"
                    placeholder="Tulis kegiatan..."
                >

                <button id="addTodo">
                    <i class="fa-solid fa-plus"></i>
                    Tambah
                </button>

            </div>

            <div id="todoList"></div>

        </section>

        <br>


    </main>

</div>

<script src="script.js"></script>

    <script src="aero-shards.js"></script>

  <a href="index.html" data-nav="home" aria-label="Home"><i class="fa-solid fa-house"></i><span>Home</span></a>
  <a href="quick-access.html" data-nav="quick" aria-label="Quick Access"><i class="fa-solid fa-grip"></i><span>Quick Access</span></a>
  <a href="finance.html" data-nav="finance" aria-label="Finance"><i class="fa-solid fa-wallet"></i><span>Finance</span></a>
  <a href="settings.html" data-nav="settings" aria-label="Pengaturan"><i class="fa-solid fa-gear"></i><span>Pengaturan</span></a>
</nav>
<script src="dock.js"></script>
<script src="myhub-plus.js"></script>
</body>
</html>
