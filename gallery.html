<div class="app">

    <main>

        <section class="gallery-section">

            <div class="gallery-grid">

                <div class="gallery-item">
                    <img src="frhn2.jpeg" alt="Foto 2">

                <div class="gallery-item">

                </div>

                <div class="gallery-item">
                    <img src="frhn4.jpeg" alt="Foto 4">
                </div>

                <div class="gallery-item">
                    <img src="frhn5.jpeg" alt="Foto 5">
                </div>

                <div class="gallery-item">
                    <img src="frhn6.jpeg" alt="Foto 6">

                <div class="gallery-item">
                    <img src="frhn7.jpeg" alt="Foto 7">
                </div>

                <div class="gallery-item">
                    <img src="frhn8.jpeg" alt="Foto 8">
                </div>

                <div class="gallery-item">
                    <img src="frhn9.jpeg" alt="Foto 9">
                </div>

                <div class="gallery-item">
                    <img src="frhn10.jpeg" alt="Foto 10">
                </div>

                <div class="gallery-item">
                    <img src="frhn11.jpeg" alt="Foto 11">

                <div class="gallery-item">
                    <img src="frhn12.jpeg" alt="Foto 12">
                </div>

            </div>

        </section>

        <!-- LIGHTBOX -->
        <div id="lightbox" class="lightbox">

            <button id="closeLightbox" class="close-lightbox">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <img id="lightboxImage" src="" alt="Preview">

        </div>

        <br>


    </main>

</div>

<script>

const galleryImages = document.querySelectorAll(".gallery-item img");
const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");
const closeLightbox = document.getElementById("closeLightbox");

galleryImages.forEach(image => {

    image.addEventListener("click", () => {

        lightboxImage.src = image.src;

        lightbox.classList.add("show");

    });

});

closeLightbox.addEventListener("click", () => {

    lightbox.classList.remove("show");

});

lightbox.addEventListener("click", (event) => {

    if (event.target === lightbox) {
        lightbox.classList.remove("show");
    }

});

</script>

<!-- MyHub side menu -->
<div class="myhub-menu-overlay" id="myhubMenu" aria-hidden="true">

    <nav class="myhub-menu-list">

      <a class="myhub-menu-link" href="game.html"><i class="fa-solid fa-gamepad"></i><span>Game</span></a>
      <a class="myhub-menu-link" href="calendar.html"><i class="fa-solid fa-calendar-days"></i><span>Calendar</span></a>

      <a class="myhub-menu-link" href="notes.html"><i class="fa-solid fa-note-sticky"></i><span>Notes</span></a>
      <a class="myhub-menu-link" href="todo.html"><i class="fa-solid fa-list-check"></i><span>To-Do</span></a>
      <a class="myhub-menu-link" href="certificates.html"><i class="fa-solid fa-trophy"></i><span>Certificates</span></a>

      <a class="myhub-menu-link" href="settings.html"><i class="fa-solid fa-gear"></i><span>Pengaturan</span></a>
    </nav>
    <div class="myhub-menu-footer">MyHub · Personal space</div>
  </aside>
</div>

<script>
(function(){
  const menu=document.getElementById('myhubMenu');
  window.openMyHubMenu=function(){
    if(!menu)return;
    menu.classList.add('open');
    menu.setAttribute('aria-hidden','false');
    document.body.classList.add('myhub-menu-open');
  };
  window.closeMyHubMenu=function(){
    if(!menu)return;
    menu.classList.remove('open');
    menu.setAttribute('aria-hidden','true');
    document.body.classList.remove('myhub-menu-open');
  };
  if(menu){
    menu.addEventListener('click',function(e){ if(e.target===menu) closeMyHubMenu(); });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeMyHubMenu(); });
  }
})();
</script>
