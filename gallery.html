<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery — MyHub</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="aero-shards.css">
</head>

<body>

    <div class="aero-shards" aria-hidden="true"><canvas id="aeroShardsCanvas"></canvas></div>

<div class="app">

    <header class="header">
        <a class="back-home" href="index.html" aria-label="Kembali ke Home" title="Kembali ke Home"><i class="fa-solid fa-house"></i></a>
        <div>
            <p class="small-title">MYHUB</p>
            <h1>Gallery</h1>
            <p class="subtitle">Foto-foto gw </p>
        </div>

        <div class="profile-icon">
            <i class="fa-solid fa-images"></i>
        </div>
    </header>

    <main>

        <section class="gallery-section">

            <div class="section-title">
                <p>MY GALLERY</p>
                <h2>Semua Foto</h2>
            </div>

            <div class="gallery-grid">

                <div class="gallery-item">
                    <img src="frhn1.jpeg" alt="Foto 1">
                </div>

                <div class="gallery-item">
                    <img src="frhn2.jpeg" alt="Foto 2">
                </div>

                <div class="gallery-item">
                    <img src="frhn3.jpeg" alt="Foto 3">
                </div>

                <div class="gallery-item">
                    <img src="frhn4.jpeg" alt="Foto 4">
                </div>

                <div class="gallery-item">
                    <img src="frhn5.jpeg" alt="Foto 5">
                </div>

                <div class="gallery-item">
                    <img src="frhn6.jpeg" alt="Foto 6">
                </div>

                <div class="gallery-item">
                    <img src="frhn7.jpeg" alt="Foto 7">
                </div>

                <div class="gallery-item">
                    <img src="frhn8.jpeg" alt="Foto 8">
                </div>

                <div class="gallery-item">
                    <img src="frhn9.jpeg" alt="Foto 9">
                </div>

                <div class="gallery-item">
                    <img src="frhn10.jpeg" alt="Foto 10">
                </div>

                <div class="gallery-item">
                    <img src="frhn11.jpeg" alt="Foto 11">
                </div>

                <div class="gallery-item">
                    <img src="frhn12.jpeg" alt="Foto 12">
                </div>

            </div>

        </section>

        <!-- LIGHTBOX -->
        <div id="lightbox" class="lightbox">

            <button id="closeLightbox" class="close-lightbox">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <img id="lightboxImage" src="" alt="Preview">

        </div>

        <br>


    </main>

</div>

<script>

const galleryImages = document.querySelectorAll(".gallery-item img");
const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");
const closeLightbox = document.getElementById("closeLightbox");

galleryImages.forEach(image => {

    image.addEventListener("click", () => {

        lightboxImage.src = image.src;

        lightbox.classList.add("show");

    });

});

closeLightbox.addEventListener("click", () => {

    lightbox.classList.remove("show");

});

lightbox.addEventListener("click", (event) => {

    if (event.target === lightbox) {
        lightbox.classList.remove("show");
    }

});

</script>

    <script src="aero-shards.js"></script>

    <nav class="bottom-nav">
        <a href="index.html" data-nav="home">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="game.html" data-nav="game">
            <i class="fa-solid fa-gamepad"></i>
            <span>Game</span>
        </a>
        <a href="finance.html" data-nav="finance">
            <i class="fa-solid fa-wallet"></i>
            <span>Finance</span>
        </a>
        <a href="settings.html" data-nav="settings">
            <i class="fa-solid fa-gear"></i>
            <span>Pengaturan</span>
        </a>
    </nav>

<script>
(function(){const p=location.pathname.split("/").pop()||"index.html";const map={"index.html":"home","game.html":"game","finance.html":"finance","settings.html":"settings"};const k=map[p]||"";document.querySelectorAll(".bottom-nav a").forEach(a=>{if(a.dataset.nav===k)a.classList.add("active");});})();
</script>
</body>
</html>
