<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile — MyHub</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="aero-shards.css">
</head>

<body>

    <div class="aero-shards" aria-hidden="true"><canvas id="aeroShardsCanvas"></canvas></div>

    <div class="app">

        <header class="header">
        <a class="back-home" href="index.html" aria-label="Kembali ke Home" title="Kembali ke Home"><i class="fa-solid fa-house"></i></a>
            <div>
                <p class="small-title">MYHUB</p>
                <h1>Profile</h1>
                <p class="subtitle">Profil pribadi lu </p>
            </div>

            <div class="profile-icon">
                <img src="frhn12.jpeg" alt="Profile">
            </div>
        </header>

        <section class="profile-box">

            <label class="profile-upload">
                <img class="profile-photo" id="profilePhoto" src="frhn12.jpeg" alt="Profile">

                <span>
                    <i class="fa-solid fa-camera"></i>
                    Ganti Foto
                </span>

                <input type="file" id="profileImageInput" accept="image/*">
            </label>

            <h2 id="profileName">frhn</h2>
            <p class="profile-bio" id="profileBio">
                Welcome to my personal space.
            </p>

            <button id="editProfile" class="edit-profile-btn">
                <i class="fa-solid fa-pen"></i>
                Edit Profil
            </button>

            <div class="edit-profile-panel" id="editProfilePanel">

                <input type="text" id="editName" placeholder="Nama lu">

                <textarea id="editBio" placeholder="Bio lu"></textarea>

                <div class="edit-profile-actions">
                    <button id="saveProfile">
                        <i class="fa-solid fa-check"></i>
                        Simpan
                    </button>

                    <button id="cancelProfile">
                        Batal
                    </button>
                </div>

            </div>

            <div class="profile-stats">
                <div>
                    <strong>MyHub</strong>
                    <span>Personal</span>
                </div>

                <div>
                    <strong>2026</strong>
                    <span>Since</span>
                </div>
            </div>

        </section>

        <br>


    </div>

    <script src="script.js"></script>

    <script src="aero-shards.js"></script>

    <nav class="bottom-nav">
        <a href="index.html" data-nav="home">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="game.html" data-nav="game">
            <i class="fa-solid fa-gamepad"></i>
            <span>Game</span>
        </a>
        <a href="finance.html" data-nav="finance">
            <i class="fa-solid fa-wallet"></i>
            <span>Finance</span>
        </a>
        <a href="settings.html" data-nav="settings">
            <i class="fa-solid fa-gear"></i>
            <span>Pengaturan</span>
        </a>
    </nav>

<script>
(function(){const p=location.pathname.split("/").pop()||"index.html";const map={"index.html":"home","game.html":"game","finance.html":"finance","settings.html":"settings"};const k=map[p]||"";document.querySelectorAll(".bottom-nav a").forEach(a=>{if(a.dataset.nav===k)a.classList.add("active");});})();
</script>
</body>

</html>
